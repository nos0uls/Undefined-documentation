site_name: Undefinedtale-888 Docs
site_url: https://nos0uls.github.io/Undefined-documentation
site_author: n0souls
site_description: Официальная документация проекта Undefinedtale-888

repo_name: nos0uls/Undefined-documentation
repo_url: https://github.com/nos0uls/Undefined-documentation
edit_uri: edit/main/docs/

not_in_nav: |
  404.md
  _snippets/abbr.md

nav:
  - Главная: index.md
  - Начало работы:
      - Установка и Настройка: getting-started/setup.md
      - Структура Проекта: getting-started/project-structure.md
      - Первый Запуск: getting-started/first-run.md
      - Синтаксис Markdown: getting-started/syntax.md
  - Архитектура:
      - Обзор: architecture/overview.md
      - Инициализация: architecture/initialization.md
      - Глобальное Состояние: architecture/global-state.md
      - Объекты: architecture/objects.md
      - Комнаты: architecture/rooms.md
  - Системы:
      - Ввод (Input): systems/input.md
      - Взаимодействие: systems/interaction.md
      - Интерфейс (UI): systems/ui.md
      - Карта тонкой настройки UI: systems/ui-tuning-map.md
      - Музыка: systems/music.md
      - Портреты диалога: systems/dialogue-portraits.md
      - Playtime: systems/playtime.md
      - Инвентарь: systems/inventory.md
      - Эмоции: systems/emote.md
      - Система сохранений: systems/save-system.md
      - Debug-инструменты: systems/debug-tools.md
      - Переходы между комнатами: systems/room-transitions.md
      - NPC и диалоги: systems/npc-dialogue.md
      - Катсцены:
          - Обзор: systems/cutscenes/overview.md
          - Архитектура: systems/cutscenes/architecture.md
          - API: systems/cutscenes/api.md
          - Актёры: systems/cutscenes/actors.md
          - Камера: systems/cutscenes/camera.md
          - Игрок в катсцене: systems/cutscenes/player_in_cutscene.md
          - Отладка: systems/cutscenes/debugging.md
          - Примеры: systems/cutscenes/examples.md
          - Troubleshooting: systems/cutscenes/troubleshooting.md
          - Partial Control: systems/cutscenes/partial-control.md
  - Редактор (Undefscene):
      - Обзор: systems/cutscenes/undefscene/overview.md
      - Справочник нод: systems/cutscenes/undefscene/nodes.md
      - How-to: systems/cutscenes/undefscene/how-to.md
      - Интерфейс: systems/cutscenes/undefscene/ui.md
      - Создание катсцены: systems/cutscenes/undefscene/workflow.md
      - Сохранение и экспорт: systems/cutscenes/undefscene/formats.md
      - Проверки перед экспортом: systems/cutscenes/undefscene/validation.md
      - FAQ: systems/cutscenes/undefscene/faq.md
      - Глоссарий: systems/cutscenes/undefscene/glossary.md
      - Room Visual Editor: systems/cutscenes/undefscene/room-visual-editor.md
      - Tutorial: systems/cutscenes/undefscene/tutorial.md
  - Глоссарий: glossary.md
  - Теги: tags.md
  - Геймплей:
      - Обзор: gameplay/overview.md
      - Управление: gameplay/controls.md
      - Механики: gameplay/mechanics.md
  - Справочник кода:
      - GML скрипты: code-reference/gml-scripts.md
      - События объектов: code-reference/events.md
      - Функции: code-reference/functions.md

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.prune
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tooltips
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: slate       # по умолчанию тёмная тема
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на светлую тему
    - scheme: default     # светлая (альтернатива)
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на тёмную тему
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.min.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: Содержание
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      extend_pygments_lang:
        - name: gml
          lang: javascript
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: false
      auto_append:
        - _snippets/abbr.md
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: ru
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      locale: ru
      enable_git_follow: false
      fallback_to_build_date: true
  - minify:
      minify_html: true
  - tags:
      tags_allowed:
        - actors
        - audio
        - camera
        - code-reference
        - controls
        - cutscene-api
        - cutscenes
        - debug
        - dialogue
        - editor
        - emote
        - events
        - functions
        - gameplay
        - getting-started
        - glossary
        - how-to
        - init
        - input
        - inventory
        - mechanics
        - music
        - nodes
        - npc-dialogue
        - persistent-objects
        - project-structure
        - room-transitions
        - rooms
        - runtime
        - save
        - scripts
        - setup
        - ui
        - ui-blocking
        - undefscene
        - yarn
  - typeset
  - social:
      cards: !ENV [MKDOCS_SOCIAL_CARDS, false]
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/n0souls
    - icon: fontawesome/brands/telegram
      link: https://t.me/n0souls

copyright: Copyright &copy; 2026 n0souls
