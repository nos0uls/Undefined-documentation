site_name: Undefinedtale-888 Docs
site_url: https://nos0uls.github.io/Undefined-documentation
site_author: n0souls
site_description: Официальная документация проекта Undefinedtale-888

repo_name: nos0uls/Undefined-documentation
repo_url: https://github.com/nos0uls/Undefined-documentation
docs_dir: docs_new
edit_uri: edit/main/docs_new/

not_in_nav: |
  404.md
  _snippets/abbr.md

exclude_docs: |
  _meta/*

nav:
  - Главная: index.md
  - Начало работы:
      - Установка и настройка: getting-started/setup.md
      - Сборка из командной строки: getting-started/build.md
      - Структура проекта: getting-started/project-structure.md
      - Конвенции кода: getting-started/conventions.md
  - Архитектура:
      - Обзор: architecture/overview.md
      - Инициализация: architecture/initialization.md
      - Иерархия объектов: architecture/object-hierarchy.md
      - Глобальное состояние: architecture/global-state.md
      - Комнаты: architecture/rooms.md
      - Форматы данных: architecture/data-formats.md
  - Системы:
      - Ввод (Input): systems/input.md
      - Игрок (obj_player): systems/player.md
      - Переходы между комнатами: systems/room-transitions.md
      - Диалоги: systems/dialogue.md
      - Взаимодействие: systems/interaction.md
      - Инвентарь и статы: systems/inventory-and-stats.md
      - Система сохранений: systems/save-system.md
      - Музыка и звук: systems/music.md
      - UI и меню: systems/ui-and-menus.md
      - Отладка и тестирование: systems/debug-and-testing.md
  - Катсцены:
      - Обзор: cutscenes/overview.md
      - Архитектура менеджера: cutscenes/architecture.md
      - JSON-действия: cutscenes/json-actions.md
      - Классы действий (Action*): cutscenes/action-classes.md
      - GML DSL (c_* и cutscene_*): cutscenes/gml-dsl.md
      - Частичный контроль: cutscenes/partial-control.md
      - Актёры и камера: cutscenes/actors-and-camera.md
      - Рецепты: cutscenes/cookbook.md
  - Редактор (Undefscene):
      - Обзор: undefscene/overview.md
      - Tutorial: undefscene/tutorial.md
      - How-to: undefscene/how-to.md
      - Workflow: undefscene/workflow.md
      - Интерфейс: undefscene/ui.md
      - Справочник нод: undefscene/nodes.md
      - Room Visual Editor: undefscene/room-visual-editor.md
      - Сохранение и экспорт: undefscene/formats.md
      - Проверки и ошибки: undefscene/validation.md
      - FAQ: undefscene/faq.md
      - Глоссарий: undefscene/glossary.md
  - Справочник:
      - GML скрипты: reference/gml-scripts.md
      - Объекты и события: reference/objects-and-events.md
      - Глоссарий: reference/glossary.md
  - Теги: tags.md

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.prune
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tooltips
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: slate       # по умолчанию тёмная тема
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на светлую тему
    - scheme: default     # светлая (альтернатива)
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на тёмную тему
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.min.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: Содержание
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      extend_pygments_lang:
        - name: gml
          lang: javascript
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: false
      auto_append:
        - _snippets/abbr.md
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: ru
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      locale: ru
      enable_git_follow: false
      fallback_to_build_date: true
      strict: false
  - minify:
      minify_html: true
  - tags:
      tags_allowed:
        - actors
        - architecture
        - audio
        - build
        - camera
        - collision
        - controls
        - conventions
        - cutscene-api
        - cutscene-json
        - cutscenes
        - data-formats
        - debug
        - depth
        - dialogue
        - editor
        - emote
        - events
        - faq
        - gamepad
        - gameplay
        - getting-started
        - globals
        - glossary
        - gml
        - how-to
        - initialization
        - input
        - interaction
        - inventory
        - menu
        - movement
        - music
        - nodes
        - npc
        - objects
        - partial-control
        - persistence
        - player
        - reference
        - rooms
        - room-transitions
        - save-system
        - settings
        - stats
        - testing
        - troubleshooting
        - ui
        - undefscene
  - typeset
  - social:
      cards: !ENV [MKDOCS_SOCIAL_CARDS, false]
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/n0souls
    - icon: fontawesome/brands/telegram
      link: https://t.me/n0souls

copyright: Copyright &copy; 2026 n0souls
